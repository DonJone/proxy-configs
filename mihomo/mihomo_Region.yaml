  - RULE-SET,games-cn,游戏平台

  # --- 国内大盘直连 (QUIC 拦截之前, 确保国内 UDP 443 不被拦截) ---
  - RULE-SET,cn,DIRECT
  - RULE-SET,dnsmasq-china,DIRECT

  # --- 通讯 (Telegram 专属：置于 QUIC 拦截前确保 MTProto UDP 443 与语音畅通) ---
  - RULE-SET,telegram,通讯
  - RULE-SET,telegram_ip,通讯,no-resolve

  # --- FCM 原生直连推送端口 (防代理握手超时) ---
  - DST-PORT,5228-5230,DIRECT

  # --- QUIC 全局拦截 (拦截所有海外 Web UDP 443，防止浏览器 QUIC 握手丢包造成数秒假死卡顿) ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC

