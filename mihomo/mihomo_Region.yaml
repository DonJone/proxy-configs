  - RULE-SET,apple-cn,微软苹果Nvidia
  - RULE-SET,microsoft-cn,微软苹果Nvidia
  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  - DOMAIN-SUFFIX,appleid.apple.com,DIRECT
  - DOMAIN-SUFFIX,gsa.apple.com,DIRECT
  - DOMAIN-SUFFIX,idmsa.apple.com,DIRECT
  - DOMAIN-SUFFIX,icloud.com.cn,DIRECT
