# ============================================================
# DNS (纯密 DoH3 + Fake-IP + 通用客户端 DNS)
# ============================================================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:cn
    - rule-set:dnsmasq-china
    - "+.lan"
    - "+.local"
    - "+.campus.edu.cn"
  nameserver: *direct-doh
  proxy-server-nameserver: *direct-doh
  direct-nameserver: *direct-doh
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "+.campus.edu.cn": "1.2.3.4"

# ============================================================
# 嗅探器 (通用客户端流媒体强制嗅探)
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.ntp.org"
    - "time.*.com"
    - "time.*.apple.com"
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
