# ============================================================
# OpenClash Hybrid Config: 多源规则 + 自建区域纯手选架构
# 规则来源: DustinWin + MetaCubeX + echs-top
# 策略组架构: Region (3 区纯手选), 平铺规则 (无 SUB-RULE)
# 环境适配: OpenClash (TUN托管 / 多端口 / geodata / DNS监听)
# ============================================================

# === 端口 (OpenClash 多端口) ===
port: 7890
socks-port: 7891
mixed-port: 7893
redir-port: 7892
tproxy-port: 7895

# === 全局设置 ===
ipv6: true
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 300
etag-support: true
external-controller: 0.0.0.0:9090
profile: { store-selected: true, store-fake-ip: true }

# === Geodata (OpenClash 兼容, 仅 GeoIP) ===
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  asn: "https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true

# === TUN (OpenClash 托管模式) ===
tun:
  enable: true
  stack: system
  device: utun
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  strict-route: false
  dns-hijack:
    - 0.0.0.0:53
  endpoint-independent-nat: true

# === Hosts DNS 引导 ===
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6, "2400:3200::1", "2400:3200:baba::1"]
  doh.pub: [120.53.53.53, 1.12.12.21]
  dns.google: [8.8.8.8, 8.8.4.4, "2001:4860:4860::8888", "2001:4860:4860::8844"]
  dns.quad9.net: [9.9.9.9, 149.112.112.112, "2620:fe::fe", "2620:fe::9"]
  services.googleapis.cn: services.googleapis.com
  google.cn: google.com

# ============================================================
# YAML 锚点定义
# ============================================================
domain: &domain {type: http, interval: 86400, proxy: 加密货币与兜底, behavior: domain, format: mrs}
ip: &ip {type: http, interval: 86400, proxy: 加密货币与兜底, behavior: ipcidr, format: mrs}
domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

Select: &Select {type: select, disable-udp: false, include-all: true}

FilterAsiaPacific: &FilterAsiaPacific '(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)'
FilterEuAm: &FilterEuAm '(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)'
FilterLowRate: &FilterLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'
FilterExcludeLowRate: &FilterExcludeLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'

direct-doh: &direct-doh ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query&h3=false"]
proxy-doh: &proxy-doh ["https://dns.google/dns-query#代理DNS", "https://dns.quad9.net/dns-query#代理DNS"]

# === 机场节点订阅 ===
proxy-providers:
  机场:
    url: "机场链接url"
    type: http
    interval: 86400
    proxy: DIRECT
    header: { User-Agent: ["clash-verge/v2.4.7"] }
    health-check:
      enable: true
      url: "https://dns.google/generate_204"
      expected-status: 204
      interval: 300
      timeout: 2000
      max-failed-times: 3
      lazy: true
    override: { ip-version: dual }
    exclude-filter: "(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外|恢复|处理|谢谢"

