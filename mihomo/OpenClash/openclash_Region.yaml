# ============================================================
# DNS (respect-rules + proxy-doh 代理链 + OpenClash listen)
# 注意: proxy-doh 经 #代理DNS 组路由, 该组必须选择有效节点否则全部海外 DNS 失败
# ============================================================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeipfilter
  nameserver: *direct-doh
  proxy-server-nameserver: *proxy-doh
  direct-nameserver: *direct-doh
  direct-nameserver-follow-policy: true
  nameserver-policy: {}

# ============================================================
# 嗅探器 (OpenClash 流媒体强制嗅探)
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.ntp.org"
    - "time.*.com"
    - "time.*.apple.com"
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
