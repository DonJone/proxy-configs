# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (Region 3 区纯手选 + 基础设施组)
# ============================================================
proxy-groups:
  # --- 手选池 (3 个) ---
  - { name: 亚太, <<: *Select, filter: *FilterAsiaPacific, exclude-filter: *FilterExcludeLowRate }
  - { name: 欧美, <<: *Select, filter: *FilterEuAm, exclude-filter: *FilterExcludeLowRate }
  - { name: 低倍, <<: *Select, filter: *FilterLowRate }

  # --- 业务组 (7 个) ---
  - { name: AI与Google, type: select, proxies: [欧美, 亚太, 低倍] }
  - { name: TikTok, type: select, proxies: [亚太, 欧美, 低倍] }
  - { name: Emby流媒体, type: select, proxies: [低倍, DIRECT, 亚太, 欧美] }
  - { name: 通讯与Github, type: select, proxies: [亚太, 欧美, 低倍, DIRECT] }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 亚太, 欧美] }
  - { name: 微软苹果Nvidia, type: select, proxies: [DIRECT, 亚太, 欧美] }
  - { name: 加密货币与兜底, type: select, proxies: [亚太, 欧美, 低倍, DIRECT] }

  # --- 静默组 (1 个) ---
  - { name: 国内服务, type: select, proxies: [DIRECT, 亚太], hidden: true }

  # --- 基础设施组 (2 个) ---
  - { name: 代理DNS, type: select, proxies: [加密货币与兜底, 欧美, 亚太], hidden: true }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

