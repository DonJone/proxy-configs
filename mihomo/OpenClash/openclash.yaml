    - MATCH,游戏平台
  applems_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,微软苹果Nvidia
  google_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,AI与Google
  trackerslist_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,漏网之鱼
  proxy_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,漏网之鱼



