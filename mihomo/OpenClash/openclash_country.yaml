  cn_ip: { <<: *ip, url: "https://raw.githubusercontent.com/echs-top/proxy/main/mrs/ip/cn.mrs", path: ./rules/cn_ip.mrs }

  # --- ShellCrash ---
  fakeipfilter: { <<: *domain_text, url: "https://raw.githubusercontent.com/juewuy/ShellCrash/refs/heads/dev/public/fake_ip_filter.list", path: ./rules/fakeipfilter.list }

# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (Country 9 区 fallback — 保持不变)
# ============================================================
proxy-groups:
  # ==========================================
  # 1. 基础组件：按国家/地区手选池
  # ==========================================
  - {
      name: 港,
      type: select,
      include-all: true,
      filter: '(?i)(港|🇭🇰|HK|Hong\s?Kong|hongkong)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 澳,
      type: select,
      include-all: true,
      filter: "(?i)(澳|🇲🇴|澳门|Macau|MO)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 台,
      type: select,
      include-all: true,
      filter: "(?i)(台|🇹🇼|TW|Taiwan|Taipei|taipei)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 日,
      type: select,
      include-all: true,
      filter: "(?i)(日|🇯🇵|JP|Japan|Tokyo|Osaka|东京|大阪)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 新,
      type: select,
      include-all: true,
      filter: "(?i)(新加坡|狮城|🇸🇬|SG|Singapore)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 美,
      type: select,
      include-all: true,
      filter: '(?i)(美|🇺🇸|US|USA|America|United\s?States|纽约|洛杉矶|芝加哥|西雅图|圣何塞|硅谷|达拉斯|波特兰|凤凰城|费利蒙|拉斯维加斯|圣克拉拉)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 欧,
      type: select,
      include-all: true,
      filter: '(?i)(英|🇬🇧|UK|GB|Britain|United\s?Kingdom|伦敦|德|🇩🇪|DE|Germany|法|🇫🇷|FR|France|荷兰|🇳🇱|NL|Netherlands|俄|🇷🇺|RU|Russia|意|🇮🇹|IT|Italy|瑞士|🇨🇭|CH|Switzerland|瑞典|🇸🇪|SE|Sweden|西班牙|🇪🇸|ES|Spain|加拿大|🇨🇦|CA|Canada|阿根廷|🇦🇷|AR|Argentina|巴西|🇧🇷|BR|Brazil|墨西哥|🇲🇽|MX|Mexico|澳大利亚|🇦🇺|AU|Australia)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 其他,
      type: select,
      include-all: true,
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 低倍,
      type: select,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }

  # ==========================================
  # 2. 备用组件：同区自动测速池 (隐藏)
  # ==========================================
  - {
      name: 港备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(港|🇭🇰|HK|Hong\s?Kong|hongkong)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 澳备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(澳|🇲🇴|澳门|Macau|MO)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 台备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(台|🇹🇼|TW|Taiwan|Taipei|taipei)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 日备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(日|🇯🇵|JP|Japan|Tokyo|Osaka|东京|大阪)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 新备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(新加坡|狮城|🇸🇬|SG|Singapore)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 美备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(美|🇺🇸|US|USA|America|United\s?States|纽约|洛杉矶|芝加哥|西雅图|圣何塞|硅谷|达拉斯|波特兰|凤凰城|费利蒙|拉斯维加斯|圣克拉拉)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 欧备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(英|🇬🇧|UK|GB|Britain|United\s?Kingdom|伦敦|德|🇩🇪|DE|Germany|法|🇫🇷|FR|France|荷兰|🇳🇱|NL|Netherlands|俄|🇷🇺|RU|Russia|意|🇮🇹|IT|Italy|瑞士|🇨🇭|CH|Switzerland|瑞典|🇸🇪|SE|Sweden|西班牙|🇪🇸|ES|Spain|加拿大|🇨🇦|CA|Canada|阿根廷|🇦🇷|AR|Argentina|巴西|🇧🇷|BR|Brazil|墨西哥|🇲🇽|MX|Mexico|澳大利亚|🇦🇺|AU|Australia)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 其他备用,
      type: url-test,
      include-all: true,
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 低倍备用,
      type: url-test,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }

  # ==========================================
  # 3. 业务分配与顶层路由
  # ==========================================
  - {
      name: AI与Google,
      type: select,
      proxies: [美区, 日区, 台区, 新区, 港区, 欧区, 低倍区, 其他区],
    }
  - {
      name: TikTok,
      type: select,
      proxies: [日区, 美区, 台区, 新区, 港区, 欧区, 低倍区, 其他区],
    }
  - {
      name: Emby流媒体,
      type: select,
      proxies: [低倍区, DIRECT, 港区, 台区, 日区, 新区, 美区, 欧区, 其他区],
    }
  - {
      name: 通讯与Github,
      type: select,
      proxies: [港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, DIRECT, 其他区],
    }
  - {
      name: 游戏平台,
      type: select,
      proxies: [DIRECT, 港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, 其他区],
    }
  - {
      name: 微软苹果Nvidia,
      type: select,
      proxies: [DIRECT, 美区, 日区, 新区, 台区, 欧区, 低倍区, 其他区],
    }
  - {
      name: 加密货币与兜底,
      type: select,
      proxies:
        [港区, 澳区, 台区, 日区, 新区, 美区, 欧区, 其他区, 低倍区, DIRECT],
    }

  # ==========================================
  # 4. 静默组
  # ==========================================
  - {
      name: 国内服务,
      type: select,
      proxies: [DIRECT, 港区, 日区, 新区],
      hidden: true,
    }

  # ==========================================
  # 5. 基础设施组
  # ==========================================
  - {
      name: 代理DNS,
      type: select,
      proxies: [加密货币与兜底, 美区, 日区, 新区, 港区],
      hidden: true,
    }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

  # ==========================================
  # 6. 核心架构：同区故障转移专线 (置底)
  # ==========================================
  - {
      name: 港区,
      type: fallback,
      proxies: [港, 港备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 澳区,
      type: fallback,
      proxies: [澳, 澳备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 台区,
      type: fallback,
      proxies: [台, 台备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 日区,
      type: fallback,
      proxies: [日, 日备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 新区,
      type: fallback,
      proxies: [新, 新备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 美区,
      type: fallback,
      proxies: [美, 美备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 欧区,
      type: fallback,
      proxies: [欧, 欧备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 其他区,
      type: fallback,
      proxies: [其他, 其他备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 低倍区,
      type: fallback,
      proxies: [低倍, 低倍备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }

# ============================================================
# 规则引擎 (平铺规则, 无 SUB-RULE)
# ============================================================
rules:
  # --- 预留地址 ---
  - IP-CIDR,169.254.169.254/32,REJECT,no-resolve

  # --- 私有地址 ---
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - DOMAIN-KEYWORD,libvio,DIRECT
  - DOMAIN-KEYWORD,uhdnow,Emby流媒体

  # --- 国内直连 (QUIC 之前, 确保国内 UDP 443 不被拦截) ---
  - RULE-SET,cn,DIRECT
  - RULE-SET,dnsmasq-china-lite,DIRECT

  # --- QUIC 全局拦截 (仅海外流量到达此处) ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC

  # --- AI 服务 ---
  - RULE-SET,ai,AI与Google

  # --- 通讯 ---
  - RULE-SET,telegram,通讯与Github
  - RULE-SET,x,通讯与Github
  - RULE-SET,fcm,通讯与Github

  # --- 流媒体 ---
  - RULE-SET,media,Emby流媒体

  # --- TikTok ---
  - RULE-SET,tiktok,TikTok

  # --- 开发者 (微软苹果之前, microsoft.mrs 可能含 github 域名) ---
  - RULE-SET,github,通讯与Github
  - DOMAIN-KEYWORD,github,通讯与Github

  # --- 微软苹果Nvidia ---
  - RULE-SET,apple,微软苹果Nvidia
  - RULE-SET,microsoft,微软苹果Nvidia
  - RULE-SET,apple-cn,微软苹果Nvidia
  - RULE-SET,microsoft-cn,微软苹果Nvidia

  # --- 游戏平台 ---
  - RULE-SET,games-cn,游戏平台

  # --- Captcha ---
  - RULE-SET,captcha,加密货币与兜底

  # --- Google (最后, 避免拦截 YouTube/AI 域名) ---
  - RULE-SET,google,AI与Google
  - RULE-SET,google-cn,AI与Google

  # --- 代理兜底 ---
  - RULE-SET,trackerslist,加密货币与兜底
  - RULE-SET,proxy_domain,加密货币与兜底
  - RULE-SET,proxy-lite,加密货币与兜底

  # --- IP 级分流 (no-resolve 避免域名误匹配) ---
  - RULE-SET,telegram_ip,通讯与Github,no-resolve
  - RULE-SET,media_ip,Emby流媒体,no-resolve
  - RULE-SET,google_ip,AI与Google,no-resolve
  - RULE-SET,proxy_ip,加密货币与兜底,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve

  # --- 端口级识别 (域名规则之后, 仅匹配纯 IP 连接) ---
  - DST-PORT,5228-5230,DIRECT
  - DST-PORT,1337/2710/6881-6999/7777,加密货币与兜底

  # --- GeoIP 兜底 ---
  - GEOIP,CN,DIRECT,no-resolve

  # --- 全局兜底 ---
  - MATCH,加密货币与兜底

# ============================================================
# DNS (respect-rules + OpenClash 监听端口)
# ============================================================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeipfilter
  nameserver: *direct-doh
  proxy-server-nameserver: *proxy-doh
  direct-nameserver: *direct-doh
  direct-nameserver-follow-policy: true
  nameserver-policy: {}

# ============================================================
# 嗅探器 (OpenClash 流媒体强制嗅探)
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80,8080-8880], override-destination: true }
    TLS: { ports: [443,8443] }
    QUIC: { ports: [443,8443] }
  force-domain:
    - '+.netflix.com'
    - '+.nflxvideo.net'
    - '+.amazonaws.com'
    - '+.media.dssott.com'
  skip-domain:
  skip-src-address:
  skip-dst-address: ["rule-set:private_ip"]
