# === 分流规则 (Surfing 骨架，目标适配自建架构) ===
rules:
  - DST-PORT,53,DNS_Hijack
  - RULE-SET,自定义规则,加密货币与兜底
  - RULE-SET,WebRTC_端/域,广告拦截
  - RULE-SET,No-ads-all_域,广告拦截
  - DOMAIN-KEYWORD,libvio,DIRECT
  - DOMAIN-KEYWORD,uhdnow,Emby流媒体
  - RULE-SET,DouYin_域,国内服务
  - RULE-SET,BiliBili_域,国内服务
  - RULE-SET,Steam_域,游戏平台
  - RULE-SET,GitHub_域,通讯与Github
  - RULE-SET,Discord_域,通讯与Github
  - RULE-SET,TikTok_域,TikTok
  - RULE-SET,Twitter_域,通讯与Github
  - RULE-SET,Twitter_IP,通讯与Github,no-resolve
  - RULE-SET,YouTube_域,通讯与Github
  - RULE-SET,GoogleFCM_域,DIRECT
  - RULE-SET,Google_域,AI与Google
  - RULE-SET,Google_IP,AI与Google,no-resolve
  - RULE-SET,Netflix_域,通讯与Github
  - RULE-SET,Netflix_IP,通讯与Github,no-resolve
  - RULE-SET,Spotify_域,通讯与Github
