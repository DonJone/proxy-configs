# ============================================================
# Surfing Default + 自建区域故障转移架构
# 骨架: Surfing (28 规则集 / 精细应用分流 / DNS_Hijack / WebRTC)
# 策略组: 自建 Architecture 1
# ============================================================

mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: true
mode: Rule
allow-lan: true
disable-keep-alive: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
updatetime: &Time 86400
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
      - name: "Accept-Language"
        value: "en-US,en;q=0.9"
unified-delay: true
tcp-concurrent: true
log-level: silent
find-process-mode: always
external-controller: 0.0.0.0:9090
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./webroot/Zash/"
secret: ""

# === 健康检查 ===
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
  proxy: DIRECT
  header:
    User-Agent:
      - "ClashMetaForAndroid/2.11.2.Meta"
      - "clash-verge/v2.2.3"

proxy-providers:
  主要地址:
    <<: *p
    override:
      additional-prefix: "Main："
    path: ./proxies/1.主要地址.yaml
    url: "此处引入您的Clash订阅链接地址"

# === 节点记忆 ===
profile:
  store-selected: true
  store-fake-ip: true

# === 嗅探 (Surfing 风格) ===
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"

# === TUN (Surfing gvisor) ===
tun:
  enable: true
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

# === DNS (Surfing 风格) ===
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "RULE-SET:CN_域"
    - "RULE-SET:Private_域"
    - "RULE-SET:GoogleFCM_域"
    - "RULE-SET:自定义规则"
  proxy-server-nameserver:
    - https://1.12.12.12:443/dns-query&h3=false
    - https://120.53.53.53:443/dns-query&h3=false
    - https://223.5.5.5:443/dns-query&h3=true
  nameserver-policy:
    "RULE-SET:CN_域,Microsoft_域,Apple_域":
      - https://1.12.12.12:443/dns-query&h3=false
      - https://120.53.53.53:443/dns-query&h3=false
      - https://223.5.5.5:443/dns-query&h3=true
  nameserver:
    - https://8.8.8.8:443/dns-query&h3=true
    - https://1.1.1.1:443/dns-query&h3=true
  direct-nameserver:
    - 1.12.12.12
    - 223.6.6.6

proxies:
  - { name: DNS_Hijack, type: dns }

# ============================================================
# 策略组 (自建 Architecture 1 + 基础设施)
# ============================================================
proxy-groups:
  - { name: 亚太, type: select, include-all: true, filter: '(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)', exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)' }
  - { name: 欧美, type: select, include-all: true, filter: '(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)', exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)' }
  - { name: 低倍, type: select, include-all: true, filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)' }
  - { name: 亚太备用, type: url-test, include-all: true, filter: '(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)', exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)', url: 'http://cp.cloudflare.com/generate_204', interval: 30, tolerance: 50, hidden: true }
  - { name: 欧美备用, type: url-test, include-all: true, filter: '(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)', exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)', url: 'http://cp.cloudflare.com/generate_204', interval: 30, tolerance: 50, hidden: true }
  - { name: 低倍备用, type: url-test, include-all: true, filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)', url: 'http://cp.cloudflare.com/generate_204', interval: 30, tolerance: 50, hidden: true }
  - { name: AI与Google, type: select, proxies: [欧美区, 亚太区, 低倍率] }
  - { name: TikTok, type: select, proxies: [亚太区, 欧美区, 低倍率] }
  - { name: Emby流媒体, type: select, proxies: [DIRECT, 亚太区, 低倍率, 欧美区] }
  - { name: 通讯与Github, type: select, proxies: [亚太区, 欧美区, 低倍率, DIRECT] }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 亚太区, 欧美区] }
  - { name: 微软苹果Nvidia, type: select, proxies: [DIRECT, 亚太区, 欧美区] }
  - { name: 加密货币与兜底, type: select, proxies: [亚太区, 欧美区, 低倍率, DIRECT] }
  - { name: 国内服务, type: select, proxies: [DIRECT, 亚太区], hidden: true }
  - { name: 广告拦截, type: select, proxies: [REJECT], hidden: true }
  - { name: 代理DNS, type: select, proxies: [加密货币与兜底, 欧美区, 亚太区], hidden: true }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }
  - { name: 亚太区, type: fallback, proxies: [亚太, 亚太备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 欧美区, type: fallback, proxies: [欧美, 欧美备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 低倍率, type: fallback, proxies: [低倍, 低倍备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }

# === 规则集锚点 ===
rule-anchor:
  Local: &Local
    { type: file, behavior: classical, format: text }
  Classical: &Classical
    { type: http, behavior: classical, format: text, interval: *Time }
  IPCIDR: &IPCIDR
    { type: http, behavior: ipcidr, format: mrs, interval: *Time }
  Domain: &Domain
    { type: http, behavior: domain, format: mrs, interval: *Time }

# === 规则集 (Surfing 28 套) ===
rule-providers:
  自定义规则:
    <<: *Local
    path: ./etc/自定义规则.list
  WebRTC_端/域:
    <<: *Classical
    path: ./rules/WebRTC.list
    url: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@main/box_bll/clash/rules/WebRTC.list"
  CN_IP:
    <<: *IPCIDR
    path: ./rules/CN_IP.mrs
