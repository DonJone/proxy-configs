# ============================================================
# Mihomo Region Core Config: 四大块收敛架构 (Direct / APAC / AI / LowRate)
# 规则来源: DonJone/proxy-rulesets (四大核心规则集)
# 策略组架构: Region (亚太/AI 手选 + 低倍自动测速 + 兜底), 四大块平铺规则
# 环境适配: 嵌入式 Linux / OpenWrt 裸核 (Mihomo Standalone Core / TUN 模式)
# 面板集成: Zashboard / Yacd-meta (静态 UI 挂载)
# 性能优化: 纯密 DoH3 零泄露、校园网/私有内网定向解析、keep-alive 60s 根除假死
# ============================================================

# === 端口 (Mihomo 裸核标准生产端口) ===
port: 7890
socks-port: 7891
mixed-port: 7893
redir-port: 7892
tproxy-port: 7895

# === 全局设置 ===
ipv6: false
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: false
find-process-mode: "off"
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 60
etag-support: true
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""
profile: { store-selected: true, store-fake-ip: true }

# === Geodata (官方完整全球 MMDB 离线库) ===
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  asn: "https://testingcf.jsdelivr.net/gh/xishang0128/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: false
geo-update-interval: 24
geodata-mode: false

# === TUN (Mihomo 裸核托管模式) ===
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  iproute2-table-index: 202
  iproute2-rule-index: 9000
  inet4-address:
    - 198.18.0.1/16
  route-address:
    - 198.18.0.0/16
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.36.0/23
    - 91.108.38.0/23
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
    - 185.76.151.0/24

# === Hosts DNS 引导 ===
hosts:
  campus.edu.cn: 10.0.0.1
  dns.alidns.com: [223.5.5.5, 223.6.6.6, "2400:3200::1", "2400:3200:baba::1"]
  doh.pub: [120.53.53.53, 1.12.12.12]
  dns.google: [8.8.8.8, 8.8.4.4, "2001:4860:4860::8888", "2001:4860:4860::8844"]
  dns.quad9.net: [9.9.9.9, 149.112.112.112, "2620:fe::fe", "2620:fe::9"]
  services.googleapis.cn: services.googleapis.com
  google.cn: google.com

# ============================================================
# YAML 锚点定义
# ============================================================
domain: &domain {type: http, interval: 86400, proxy: 兜底, behavior: domain, format: mrs}
ip: &ip {type: http, interval: 86400, proxy: 兜底, behavior: ipcidr, format: mrs}
domain_text: &domain_text {type: http, interval: 86400, proxy: 兜底, behavior: domain, format: text}
ip_text: &ip_text {type: http, interval: 86400, proxy: 兜底, behavior: ipcidr, format: text}

Select: &Select {type: select, disable-udp: false, include-all: true}

FilterAsiaPacific: &FilterAsiaPacific '(?i)(港|Hong|Kong|台|Tai|Wan|日|Japan|新加坡|狮城|Singapore|韩|Korea|马|Malaysia|印度|India|澳|Australia|澳门|Macau|(?:^|[^a-zA-Z])(HK|TW|JP|SG|KR|MY|IN|AU)(?:[^a-zA-Z]|$))'
FilterAI: &FilterAI '(?i)(新加坡|狮城|Singapore|日|Japan|美|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|英|Kingdom|Britain|伦敦|德|Germany|法|France|荷兰|Netherlands|意|Italy|瑞士|Switzerland|瑞典|Sweden|欧洲|Europe|(?:^|[^a-zA-Z])(SG|JP|US|UK|DE|FR|NL|IT|CH|SE|EU)(?:[^a-zA-Z]|$))'
FilterLowRate: &FilterLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'
FilterExcludeLowRate: &FilterExcludeLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'

direct-doh: &direct-doh ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query", "223.5.5.5"]
proxy-doh: &proxy-doh ["https://dns.google/dns-query#代理DNS", "https://dns.quad9.net/dns-query#代理DNS"]

# === 机场节点订阅 ===
proxy-providers:
  机场:
    url: "机场链接url"
    type: http
    path: ./proxy_provider/机场.yaml
    interval: 86400
    proxy: DIRECT
    header: { User-Agent: ["clash-verge/v2.4.7"] }
    health-check:
      enable: true
      url: "https://cp.cloudflare.com/generate_204"
      expected-status: 204
      interval: 300
      timeout: 5000
      max-failed-times: 3
      lazy: true
    override: { ip-version: ipv4-prefer }
    exclude-filter: "(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外|恢复|处理|谢谢"

# ============================================================
# 规则集提供者 (DonJone/proxy-rulesets 四大块架构)
# ============================================================
rule-providers:
  # --- proxy-rulesets (四大核心流向: direct / apac / ai / lowrate) ---
  direct: { <<: *domain, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/direct.mrs", path: ./rules/direct.mrs }
  direct_ip: { <<: *ip, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/direct_ip.mrs", path: ./rules/direct_ip.mrs }

  apac: { <<: *domain, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/apac.mrs", path: ./rules/apac.mrs }
  apac_ip: { <<: *ip, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/apac_ip.mrs", path: ./rules/apac_ip.mrs }

  ai: { <<: *domain, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/ai.mrs", path: ./rules/ai.mrs }
  ai_ip: { <<: *ip, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/ai_ip.mrs", path: ./rules/ai_ip.mrs }

  lowrate: { <<: *domain, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/lowrate.mrs", path: ./rules/lowrate.mrs }
  lowrate_ip: { <<: *ip, url: "https://fastly.jsdelivr.net/gh/DonJone/proxy-rulesets@release/rules/mihomo/lowrate_ip.mrs", path: ./rules/lowrate_ip.mrs }

  # --- ShellCrash fake-ip-filter ---
  fakeipfilter: { <<: *domain_text, url: "https://raw.githubusercontent.com/juewuy/ShellCrash/refs/heads/dev/public/fake_ip_filter.list", path: ./rules/fakeipfilter.list }

# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (四大块架构: 亚太/AI 手选 + 低倍自动测速 + 兜底 + 基础设施组)
# ============================================================
proxy-groups:
  # --- 手选池 (3 个手选 + 1 个自动测速) ---
  - { name: 亚太, <<: *Select, filter: *FilterAsiaPacific, exclude-filter: *FilterExcludeLowRate }
  - { name: AI, <<: *Select, filter: *FilterAI, exclude-filter: *FilterExcludeLowRate }
  - { name: 低倍自动, type: url-test, include-all: true, filter: *FilterLowRate, interval: 180, tolerance: 30, lazy: true, url: "https://cp.cloudflare.com/generate_204" }
  - { name: 低倍, type: select, proxies: [低倍自动], include-all: true, filter: *FilterLowRate }

  # --- 兜底组 ---
  - { name: 兜底, type: select, proxies: [低倍, 亚太, AI, DIRECT] }

  # --- 静默组 ---
  - { name: 国内服务, type: select, proxies: [DIRECT, 亚太], hidden: true }

  # --- 基础设施组 ---
  - { name: 代理DNS, type: select, proxies: [兜底, 亚太], hidden: true }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

# ============================================================
# 规则引擎 (四大块平铺规则, 无 SUB-RULE)
# ============================================================
rules:
  - DOMAIN-SUFFIX,campus.edu.cn,DIRECT
  # --- 基础地址与 NTP 时间保护 (杜绝时间偏移与证书失效) ---
  - IP-CIDR,169.254.169.254/32,REJECT,no-resolve
  - IP-CIDR,5.28.195.0/24,REJECT,no-resolve
  - DST-PORT,123,DIRECT
  - DOMAIN-KEYWORD,ntp,DIRECT
  - DOMAIN-SUFFIX,pool.ntp.org,DIRECT
  - DOMAIN-SUFFIX,ntsc.ac.cn,DIRECT

  # --- Google FCM 推送端口直连保护 ---
  - DST-PORT,5228-5230,DIRECT

  # --- 直连规则集 (包含私有网络、国内大盘、Apple/Microsoft国内生态、游戏切片CDN等) ---
  - RULE-SET,direct,DIRECT
  - RULE-SET,direct_ip,DIRECT,no-resolve

  # --- 亚太规则集 (Telegram 核心 IP/域名、Twitter/X、Steam/Epic 商城与社交) ---
  # 关键约束：置于 QUIC 拦截之前，确保 Telegram MTProto UDP 443 语音与握手不被误拦截
  - RULE-SET,apac,亚太
  - RULE-SET,apac_ip,亚太,no-resolve

  # --- QUIC 全局拦截 (拦截海外 Web UDP 443，强制回退 TCP，防止浏览器与 YouTube 假死卡顿) ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC

  # --- AI 核心规则集 (OpenAI, Claude, Gemini, Copilot, Grok, Mistral, Google 全家桶, TikTok) ---
  - RULE-SET,ai,AI
  - RULE-SET,ai_ip,AI,no-resolve

  # --- 低倍/大流量规则集 (YouTube, Netflix, Disney+, Emby 流媒体, GitHub, 海外大盘) ---
  - RULE-SET,lowrate,低倍
  - RULE-SET,lowrate_ip,低倍,no-resolve

  # --- GeoIP 国内兜底 ---
  - GEOIP,CN,DIRECT,no-resolve

  # --- 最终兜底 ---
  - MATCH,兜底

# ============================================================
# DNS (纯密 DoH3 + Fake-IP + 校园网/私有内网定向解析 + 裸核监听 7874)
# ============================================================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  respect-rules: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeipfilter
    - rule-set:direct
    - "+.lan"
    - "+.local"
    - "+.campus.edu.cn"
  nameserver: *direct-doh
  proxy-server-nameserver: *direct-doh
  direct-nameserver: *direct-doh
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "+.campus.edu.cn": "1.2.3.4"

# ============================================================
# 嗅探器 (Mihomo 裸核流媒体强制嗅探)
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443, 8443] }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.ntp.org"
    - "time.*.com"
    - "time.*.apple.com"
  skip-dst-address:
    - 91.105.192.0/23
    - 91.108.4.0/22
    - 91.108.8.0/21
    - 91.108.16.0/21
    - 91.108.56.0/22
    - 95.161.64.0/20
    - 149.154.160.0/20
