# ============================================================
# Hybrid Config: GinsRule-git 骨架 + 自建区域故障转移架构
# 规则来源: GinsRule-git (dns/rules/rule-providers/sniffer/tun)
# 策略组来源: 自建 Architecture 1 (Region-based fallback)
# ============================================================

# === 全局设置 ===
ipv6: true
allow-lan: false
bind-address: "*"
mode: rule
log-level: error
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 300
etag-support: true
port: 0
socks-port: 0
mixed-port: 7890
tproxy-port: 0
redir-port: 0
profile: { store-selected: true, store-fake-ip: true }

# === TUN 虚拟网卡 ===
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  disable-icmp-forwarding: true
  dns-hijack: [any:53, tcp://any:53]

# === Hosts DNS 引导 ===
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6, "2400:3200::1", "2400:3200:baba::1"]
  doh.pub: [120.53.53.53, 1.12.12.21]
  dns.google: [8.8.8.8, 8.8.4.4, "2001:4860:4860::8888", "2001:4860:4860::8844"]
  dns.quad9.net: [9.9.9.9, 149.112.112.112, "2620:fe::fe", "2620:fe::9"]
  services.googleapis.cn: services.googleapis.com
  google.cn: google.com

# === 机场节点订阅 ===
proxy-providers:
  机场:
    url: "机场链接url"
    type: http
    interval: 86400
    proxy: DIRECT
    header: { User-Agent: ["clash-verge/v2.4.7"] }
    health-check:
      enable: true
      url: "https://dns.google/generate_204"
      expected-status: 204
      interval: 900
      timeout: 3000
      max-failed-times: 2
      lazy: false
    override: { ip-version: dual }
    exclude-filter: "(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外|恢复|处理|谢谢"

# === 规则集定义锚点 ===
ip:
  &ip {
    type: http,
    interval: 86400,
    proxy: 加密货币与兜底,
    behavior: ipcidr,
    format: mrs,
  }
domain:
  &domain {
    type: http,
    interval: 86400,
    proxy: 加密货币与兜底,
    behavior: domain,
    format: mrs,
  }

