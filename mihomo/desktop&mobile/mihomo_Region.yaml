# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (自建 Architecture 1 + 2 个基础设施组)
# ============================================================
proxy-groups:
  # ==========================================
  # 1. 基础组件：三大手选池（按地区/倍率过滤）
  # ==========================================
  - {
      name: 亚太,
      type: select,
      include-all: true,
      filter: "(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 欧美,
      type: select,
      include-all: true,
      filter: "(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 低倍,
      type: select,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }

  # ==========================================
  # 2. 备用组件：同区自动测速池 (隐藏)
  # ==========================================
  - {
      name: 亚太备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 欧美备用,
      type: url-test,
      include-all: true,
      filter: "(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)",
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 低倍备用,
      type: url-test,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }

  # ==========================================
  # 3. 业务分配与顶层路由
  # ==========================================
  - { name: AI与Google, type: select, proxies: [欧美区, 亚太区, 低倍率] }
  - { name: TikTok, type: select, proxies: [亚太区, 欧美区, 低倍率] }
  - {
      name: Emby流媒体,
      type: select,
      proxies: [DIRECT, 亚太区, 低倍率, 欧美区],
    }
  - {
      name: 通讯与Github,
      type: select,
      proxies: [亚太区, 欧美区, 低倍率, DIRECT],
    }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 亚太区, 欧美区, 低倍率] }
  - {
      name: 微软苹果Nvidia,
      type: select,
      proxies: [DIRECT, 亚太区, 欧美区, 低倍率],
    }
  - {
      name: 加密货币与兜底,
      type: select,
      proxies: [亚太区, 欧美区, 低倍率, DIRECT],
    }

  # ==========================================
  # 4. 静默组
  # ==========================================
  - { name: 国内服务, type: select, proxies: [DIRECT, 亚太区], hidden: true }
  - { name: 广告拦截, type: select, proxies: [REJECT], hidden: true }

  # ==========================================
  # 5. 基础设施组（DNS/rules 结构需要）
  # ==========================================
  - {
      name: 代理DNS,
      type: select,
      proxies: [加密货币与兜底, 欧美区, 亚太区],
      hidden: true,
    }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

  # ==========================================
  # 6. 核心架构：同区故障转移专线 (置底)
  # ==========================================
  - {
      name: 亚太区,
      type: fallback,
      proxies: [亚太, 亚太备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 欧美区,
      type: fallback,
      proxies: [欧美, 欧美备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 低倍率,
      type: fallback,
      proxies: [低倍, 低倍备用],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }

# ============================================================
# 规则引擎 (GinsRule-git 规则，目标组名适配自建架构)
# ============================================================
rules:
  # --- 端口级识别 ---
  - DST-PORT,5228-5230,DIRECT
  - DST-PORT,1337/2710/6881-6999/7777,加密货币与兜底

  # --- 私有地址优先 ---
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - DOMAIN-KEYWORD,libvio,DIRECT
  - DOMAIN-KEYWORD,uhdnow,Emby流媒体

  # --- 广告拦截 ---
  - RULE-SET,AWAvenue-Ads,广告拦截
  - RULE-SET,reject_privacy,广告拦截
  - RULE-SET,reject_list,广告拦截

  # --- AI 服务 ---
  - SUB-RULE,(RULE-SET,ai),ai_rules

  # --- 通讯与社交 ---
  - SUB-RULE,(RULE-SET,telegram),telegram_rules
  - SUB-RULE,(RULE-SET,twitter),telegram_rules
  - SUB-RULE,(RULE-SET,reddit),telegram_rules
  - SUB-RULE,(RULE-SET,discord),telegram_rules
  - SUB-RULE,(RULE-SET,facebook),telegram_rules
  - SUB-RULE,(RULE-SET,instagram),telegram_rules
  - SUB-RULE,(RULE-SET,threads),telegram_rules
  - SUB-RULE,(RULE-SET,linkedin),telegram_rules
  - SUB-RULE,(RULE-SET,signal),telegram_rules
  - SUB-RULE,(RULE-SET,slack),telegram_rules
  - SUB-RULE,(RULE-SET,snapchat),telegram_rules
  - SUB-RULE,(RULE-SET,whatsapp),telegram_rules
  - SUB-RULE,(RULE-SET,stackoverflow),telegram_rules
  - SUB-RULE,(RULE-SET,wikipedia),telegram_rules
  - SUB-RULE,(RULE-SET,line),telegram_rules

  # --- 流媒体 ---
  - SUB-RULE,(RULE-SET,youtube),media_rules
  - SUB-RULE,(RULE-SET,netflix),media_rules
  - SUB-RULE,(RULE-SET,disney),media_rules
  - SUB-RULE,(RULE-SET,hbo),media_rules
  - SUB-RULE,(RULE-SET,spotify),media_rules
  - SUB-RULE,(RULE-SET,primevideo),media_rules
  - SUB-RULE,(RULE-SET,amazon),media_rules
  - SUB-RULE,(RULE-SET,twitch),media_rules
  - SUB-RULE,(RULE-SET,appletv),media_rules

  # --- TikTok ---
  - SUB-RULE,(RULE-SET,tiktok),tiktok_rules

  # --- 游戏平台 ---
  - SUB-RULE,(RULE-SET,steam),gaming_rules
  - SUB-RULE,(RULE-SET,epic),gaming_rules
  - SUB-RULE,(RULE-SET,blizzard),gaming_rules
  - SUB-RULE,(RULE-SET,playstation),gaming_rules
  - SUB-RULE,(RULE-SET,nintendo),gaming_rules
  - SUB-RULE,(RULE-SET,xbox),gaming_rules
  - SUB-RULE,(RULE-SET,riot),gaming_rules

  # --- 微软苹果云服务 ---
  - SUB-RULE,(RULE-SET,apple),applems_rules
  - SUB-RULE,(RULE-SET,apple-music),applems_rules
  - SUB-RULE,(RULE-SET,microsoft),applems_rules
  - SUB-RULE,(RULE-SET,onedrive),applems_rules

  # --- 国内服务直连 ---
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,direct_domain,DIRECT
  - RULE-SET,cn,DIRECT

  # --- Google ---
  - SUB-RULE,(RULE-SET,google),google_rules

  # --- 开发者与基础设施 ---
  - RULE-SET,github,通讯与Github
  - SUB-RULE,(RULE-SET,gitlab),telegram_rules
  - SUB-RULE,(RULE-SET,docker),proxy_rules
  - SUB-RULE,(RULE-SET,notion),proxy_rules
  - SUB-RULE,(RULE-SET,npm),proxy_rules
  - SUB-RULE,(RULE-SET,vercel),proxy_rules
  - SUB-RULE,(RULE-SET,speedtest),proxy_rules

  # --- 加密货币与金融 ---
  - SUB-RULE,(RULE-SET,okx),proxy_rules
  - SUB-RULE,(RULE-SET,binance),proxy_rules
  - SUB-RULE,(RULE-SET,paypal),proxy_rules
  - SUB-RULE,(RULE-SET,cloudflare),proxy_rules

  # --- 代理兜底 ---
  - SUB-RULE,(RULE-SET,trackerslist),trackerslist_rules
  - SUB-RULE,(RULE-SET,proxy_domain),proxy_rules
  - SUB-RULE,(RULE-SET,proxy),proxy_rules

  # --- IP 级分流 ---
  - SUB-RULE,(RULE-SET,telegram_ip),telegram_rules

  # --- 国内 IP 直连 ---
  - RULE-SET,direct_ip,DIRECT
  - RULE-SET,cn_ip,DIRECT

  # --- QUIC 与高位端口兜底 ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
  - DST-PORT,10000-65535,加密货币与兜底

  # --- 全局兜底 ---
  - MATCH,加密货币与兜底

# ============================================================
# 子规则 (GinsRule-git 规则，MATCH 目标适配)
# ============================================================
sub-rules:
  ai_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,AI与Google
  telegram_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,通讯与Github
  media_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,Emby流媒体
  tiktok_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,TikTok
  gaming_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,游戏平台
  applems_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,微软苹果Nvidia
  google_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,AI与Google
  trackerslist_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,加密货币与兜底
  proxy_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,加密货币与兜底

# ============================================================
# DNS (GinsRule-git 骨架)
# ============================================================
direct-dns: &direct-dns [119.29.29.29, 223.5.5.5, "2402:4e00::", "2400:3200::1"]
direct-doh:
  &direct-doh [
    "https://dns.alidns.com/dns-query",
    "https://doh.pub/dns-query&h3=false",
  ]
proxy-doh:
  &proxy-doh [
    "https://dns.google/dns-query#代理DNS",
    "https://dns.quad9.net/dns-query#代理DNS",
  ]

dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd00:bada:55ed::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:apple-cn"
    - "rule-set:microsoft-cn"
    - "rule-set:direct_domain"
    - "rule-set:cn"
    - "rule-set:cn-cdn"
  proxy-server-nameserver: *direct-doh
  nameserver-policy:
    "rule-set:private": *direct-dns
    "rule-set:AWAvenue-Ads": [rcode://name_error]
    "rule-set:reject_privacy": [rcode://name_error]
    "rule-set:reject_list": [rcode://name_error]
    "rule-set:ai": *proxy-doh
    "rule-set:telegram": *proxy-doh
    "rule-set:twitter": *proxy-doh
    "rule-set:reddit": *proxy-doh
