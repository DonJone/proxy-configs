# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (Region 3 区故障转移 + 基础设施组)
# ============================================================
proxy-groups:
  # --- 手选池 (3 个) ---
  - { name: 亚太, <<: *Select, filter: *FilterAsiaPacific, exclude-filter: *FilterExcludeLowRate }
  - { name: 欧美, <<: *Select, filter: *FilterEuAm, exclude-filter: *FilterExcludeLowRate }
  - { name: 低倍, <<: *Select, filter: *FilterLowRate }

  # --- 备用自动测速池 (3 个, 隐藏) ---
  - { name: 亚太备用, <<: *UrlTest, filter: *FilterAsiaPacific, exclude-filter: *FilterExcludeLowRate }
  - { name: 欧美备用, <<: *UrlTest, filter: *FilterEuAm, exclude-filter: *FilterExcludeLowRate }
  - { name: 低倍备用, <<: *UrlTest, filter: *FilterLowRate }

  # --- 业务组 (7 个) ---
  - { name: AI与Google, type: select, proxies: [欧美区, 亚太区, 低倍率] }
  - { name: TikTok, type: select, proxies: [亚太区, 欧美区, 低倍率] }
  - { name: Emby流媒体, type: select, proxies: [DIRECT, 亚太区, 低倍率, 欧美区] }
  - { name: 通讯与Github, type: select, proxies: [亚太区, 欧美区, 低倍率, DIRECT] }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 亚太区, 欧美区, 低倍率] }
  - { name: 微软苹果Nvidia, type: select, proxies: [DIRECT, 亚太区, 欧美区, 低倍率] }
  - { name: 加密货币与兜底, type: select, proxies: [亚太区, 欧美区, 低倍率, DIRECT] }

  # --- 静默组 (2 个) ---
  - { name: 国内服务, type: select, proxies: [DIRECT, 亚太区], hidden: true }
  - { name: 广告拦截, type: select, proxies: [REJECT], hidden: true }

  # --- 基础设施组 (2 个) ---
  - { name: 代理DNS, type: select, proxies: [加密货币与兜底, 欧美区, 亚太区], hidden: true }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

  # --- 故障转移区 (3 个, 置底) ---
  - { name: 亚太区, <<: *FallBack, proxies: [亚太, 亚太备用] }
  - { name: 欧美区, <<: *FallBack, proxies: [欧美, 欧美备用] }
  - { name: 低倍率, <<: *FallBack, proxies: [低倍, 低倍备用] }

# ============================================================
# 规则引擎 (平铺规则, 无 SUB-RULE)
# 规则顺序: 国内直连 → QUIC 拦截 → 代理业务 → MATCH 兜底
# ============================================================
rules:
  # --- 端口级识别 ---
  - DST-PORT,5228-5230,DIRECT
  - DST-PORT,1337/2710/6881-6999/7777,加密货币与兜底

  # --- 预留地址 ---
  - IP-CIDR,169.254.169.254/32,REJECT,no-resolve

  # --- 私有地址 ---
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - DOMAIN-KEYWORD,libvio,DIRECT
  - DOMAIN-KEYWORD,uhdnow,Emby流媒体

  # --- 广告拦截 ---
  - RULE-SET,AWAvenue-Ads,广告拦截
  - RULE-SET,reject_privacy,广告拦截
  - RULE-SET,reject_list,广告拦截

  # --- 国内服务直连 (QUIC 之前, 确保国内 UDP 443 不被拦截) ---
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,direct_domain,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,fcm,国内服务

  # --- QUIC 全局拦截 (仅海外流量到达此处) ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC

