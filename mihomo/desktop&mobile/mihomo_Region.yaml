# ============================================================
# Hybrid Config: GinsRule-git 骨架 + 自建区域故障转移架构
# 规则来源: GinsRule-git
# 策略组架构: Region (3 区故障转移), 平铺规则 (无 SUB-RULE)
# ============================================================

# === 全局设置 ===
ipv6: true
allow-lan: false
bind-address: "*"
mode: rule
log-level: error
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
disable-keep-alive: false
keep-alive-interval: 15
keep-alive-idle: 600
etag-support: true
port: 0
socks-port: 0
mixed-port: 7890
tproxy-port: 0
redir-port: 0
profile: { store-selected: true, store-fake-ip: true }

# === TUN 虚拟网卡 ===
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  disable-icmp-forwarding: true
  dns-hijack: [any:53, tcp://any:53]

# === Geodata (GeoIP/GeoSite 兜底) ===
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
geo-auto-update: true
geo-update-interval: 24

# === Hosts DNS 引导 ===
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6, "2400:3200::1", "2400:3200:baba::1"]
  doh.pub: [120.53.53.53, 1.12.12.21]
  dns.google: [8.8.8.8, 8.8.4.4, "2001:4860:4860::8888", "2001:4860:4860::8844"]
  dns.quad9.net: [9.9.9.9, 149.112.112.112, "2620:fe::fe", "2620:fe::9"]
  services.googleapis.cn: services.googleapis.com
  google.cn: google.com

# ============================================================
# YAML 锚点定义
# ============================================================
# 规则集类型
RuleSetDomain: &RuleSetDomain {type: http, interval: 86400, proxy: 加密货币与兜底, behavior: domain, format: mrs}
RuleSetIP: &RuleSetIP {type: http, interval: 86400, proxy: 加密货币与兜底, behavior: ipcidr, format: mrs}
RuleSetDomainText: &RuleSetDomainText {type: http, interval: 86400, behavior: domain, format: text}

# 策略组类型
Select: &Select {type: select, disable-udp: false, include-all: true}
UrlTest: &UrlTest {type: url-test, url: 'http://cp.cloudflare.com/generate_204', disable-udp: false, hidden: true, include-all: true, interval: 300, lazy: true, tolerance: 50, timeout: 2000, max-failed-times: 3}
FallBack: &FallBack {type: fallback, url: 'http://cp.cloudflare.com/generate_204', disable-udp: false, hidden: true, include-all: true, interval: 300, lazy: true, timeout: 2000, max-failed-times: 3}

# 过滤词
FilterAsiaPacific: &FilterAsiaPacific '(?i)(港|HK|Hong|Kong|台|TW|Tai|Wan|日|JP|Japan|新加坡|狮城|SG|Singapore|韩|KR|Korea|马|MY|Malaysia|印度|IN|India|澳|AU|Australia|澳门|Macau)'
FilterEuAm: &FilterEuAm '(?i)(美|US|America|纽约|洛杉矶|圣何塞|芝加哥|西雅图|加拿大|CA|Canada|英|UK|Kingdom|Britain|伦敦|德|DE|Germany|法|FR|France|荷兰|NL|Netherlands|俄|RU|Russia|意|IT|Italy|瑞士|CH|Switzerland|瑞典|SE|Sweden|阿根廷|AR|Argentina|巴西|BR|Brazil|墨西哥|MX|Mexico)'
FilterLowRate: &FilterLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'
FilterExcludeLowRate: &FilterExcludeLowRate '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)'

# DNS 服务器
direct-doh: &direct-doh ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query&h3=false"]
proxy-doh: &proxy-doh ["https://dns.google/dns-query#代理DNS", "https://dns.quad9.net/dns-query#代理DNS"]

# === 机场节点订阅 ===
proxy-providers:
  机场:
    url: "机场链接url"
    type: http
    interval: 86400
    proxy: DIRECT
    header: { User-Agent: ["clash-verge/v2.4.7"] }
    health-check:
      enable: true
      url: "https://dns.google/generate_204"
      expected-status: 204
      interval: 300
      timeout: 2000
      max-failed-times: 3
      lazy: true
    override: { ip-version: dual }
    exclude-filter: "(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|海外|恢复|处理|谢谢"

