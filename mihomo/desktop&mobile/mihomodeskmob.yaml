# === IP 版本辅助节点 ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (ABC 线路故障转移 — 保持不变)
# ============================================================
proxy-groups:
  # === 1. 基础组件：三大手选组 ===
  - { name: 手选节点 A, type: select, include-all: true }
  - { name: 手选节点 B, type: select, include-all: true }
  - { name: 手选节点 C, type: select, include-all: true }

  # === 2. 全局自动测速池 ===
  - {
      name: 全局自动,
      type: url-test,
      include-all: true,
      exclude-filter: "(?i)dialer",
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
      tolerance: 50,
      hidden: true,
    }

  # === 3. 故障转移线路 ===
  - {
      name: 线路 A,
      type: fallback,
      proxies: [手选节点 A, 全局自动],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 线路 B,
      type: fallback,
      proxies: [手选节点 B, 全局自动],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }
  - {
      name: 线路 C,
      type: fallback,
      proxies: [手选节点 C, 全局自动],
      url: "http://cp.cloudflare.com/generate_204",
      interval: 30,
    }

  # === 4. 业务分配 ===
  - { name: AI与Google, type: select, proxies: [线路 A, 线路 B, 线路 C] }
  - { name: TikTok, type: select, proxies: [线路 B, 线路 C, 线路 A] }
  - {
      name: Emby流媒体,
      type: select,
      proxies: [DIRECT, 线路 A, 线路 B, 线路 C],
    }
  - {
      name: 通讯与Github,
      type: select,
      proxies: [线路 A, 线路 B, 线路 C, DIRECT],
    }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 线路 A, 线路 B, 线路 C] }
  - {
      name: 微软苹果Nvidia,
      type: select,
      proxies: [DIRECT, 线路 A, 线路 B, 线路 C],
    }
  - { name: 漏网之鱼, type: select, proxies: [线路 A, 线路 B, 线路 C] }

  # === 5. 静默组 ===
  - {
      name: 国内服务,
      type: select,
      proxies: [DIRECT, 线路 A, 线路 B, 线路 C],
      hidden: true,
    }

  # === 6. 基础设施组 ===
  - {
      name: 代理DNS,
      type: select,
      proxies: [漏网之鱼, 线路 A, 线路 B],
      hidden: true,
    }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

