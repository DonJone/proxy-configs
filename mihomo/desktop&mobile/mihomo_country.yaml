# === IP 版本辅助节点 (echs-top) ===
proxies:
  - { name: IPV4优先, type: direct, udp: true, ip-version: ipv4-prefer }
  - { name: IPV6优先, type: direct, udp: true, ip-version: ipv6-prefer }
  - { name: 仅IPV4, type: direct, udp: true, ip-version: ipv4 }
  - { name: 仅IPV6, type: direct, udp: true, ip-version: ipv6 }

# ============================================================
# 策略组 (自建 Architecture 1 + 2 个基础设施组)
# ============================================================
proxy-groups:
  # ==========================================
  # 1. 基础组件：按国家/地区手选池
  # ==========================================
  - {
      name: 港,
      type: select,
      include-all: true,
      filter: '(?i)(港|🇭🇰|HK|Hong\s?Kong|hongkong)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 澳,
      type: select,
      include-all: true,
      filter: '(?i)(澳|🇲🇴|澳门|Macau|MO)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 台,
      type: select,
      include-all: true,
      filter: '(?i)(台|🇹🇼|TW|Taiwan|Taipei|taipei)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 日,
      type: select,
      include-all: true,
      filter: '(?i)(日|🇯🇵|JP|Japan|Tokyo|Osaka|东京|大阪)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 新,
      type: select,
      include-all: true,
      filter: '(?i)(新加坡|狮城|🇸🇬|SG|Singapore)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 美,
      type: select,
      include-all: true,
      filter: '(?i)(美|🇺🇸|US|USA|America|United\s?States|纽约|洛杉矶|芝加哥|西雅图|圣何塞|硅谷|达拉斯|波特兰|凤凰城|费利蒙|拉斯维加斯|圣克拉拉)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 欧,
      type: select,
      include-all: true,
      filter: '(?i)(英|🇬🇧|UK|GB|Britain|United\s?Kingdom|伦敦|德|🇩🇪|DE|Germany|法|🇫🇷|FR|France|荷兰|🇳🇱|NL|Netherlands|俄|🇷🇺|RU|Russia|意|🇮🇹|IT|Italy|瑞士|🇨🇭|CH|Switzerland|瑞典|🇸🇪|SE|Sweden|西班牙|🇪🇸|ES|Spain|加拿大|🇨🇦|CA|Canada|阿根廷|🇦🇷|AR|Argentina|巴西|🇧🇷|BR|Brazil|墨西哥|🇲🇽|MX|Mexico|澳大利亚|🇦🇺|AU|Australia)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 其他,
      type: select,
      include-all: true,
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }
  - {
      name: 低倍,
      type: select,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
    }

  # ==========================================
  # 2. 备用组件：同区自动测速池 (隐藏)
  # ==========================================
  - {
      name: 港备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(港|🇭🇰|HK|Hong\s?Kong|hongkong)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 澳备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(澳|🇲🇴|澳门|Macau|MO)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 台备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(台|🇹🇼|TW|Taiwan|Taipei|taipei)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 日备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(日|🇯🇵|JP|Japan|Tokyo|Osaka|东京|大阪)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 新备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(新加坡|狮城|🇸🇬|SG|Singapore)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 美备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(美|🇺🇸|US|USA|America|United\s?States|纽约|洛杉矶|芝加哥|西雅图|圣何塞|硅谷|达拉斯|波特兰|凤凰城|费利蒙|拉斯维加斯|圣克拉拉)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 欧备用,
      type: url-test,
      include-all: true,
      filter: '(?i)(英|🇬🇧|UK|GB|Britain|United\s?Kingdom|伦敦|德|🇩🇪|DE|Germany|法|🇫🇷|FR|France|荷兰|🇳🇱|NL|Netherlands|俄|🇷🇺|RU|Russia|意|🇮🇹|IT|Italy|瑞士|🇨🇭|CH|Switzerland|瑞典|🇸🇪|SE|Sweden|西班牙|🇪🇸|ES|Spain|加拿大|🇨🇦|CA|Canada|阿根廷|🇦🇷|AR|Argentina|巴西|🇧🇷|BR|Brazil|墨西哥|🇲🇽|MX|Mexico|澳大利亚|🇦🇺|AU|Australia)',
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 其他备用,
      type: url-test,
      include-all: true,
      exclude-filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }
  - {
      name: 低倍备用,
      type: url-test,
      include-all: true,
      filter: '(?i)((?:^|[^.\d])0(?:\.[0-7]\d*)?\s*[xX倍]|低倍)',
      url: 'http://cp.cloudflare.com/generate_204',
      interval: 30,
      tolerance: 50,
      hidden: true,
    }

  # ==========================================
  # 3. 业务分配与顶层路由
  # ==========================================
  - { name: AI与Google, type: select, proxies: [美区, 日区, 台区, 新区, 港区, 欧区, 低倍区, 其他区] }
  - { name: TikTok, type: select, proxies: [日区, 美区, 台区, 新区, 港区, 欧区, 低倍区, 其他区] }
  - { name: Emby流媒体, type: select, proxies: [DIRECT, 港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, 其他区] }
  - { name: 通讯与Github, type: select, proxies: [港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, DIRECT, 其他区] }
  - { name: 游戏平台, type: select, proxies: [DIRECT, 港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, 其他区] }
  - { name: 微软苹果Nvidia, type: select, proxies: [DIRECT, 美区, 日区, 新区, 台区, 欧区, 低倍区, 其他区] }
  - { name: 加密货币与兜底, type: select, proxies: [港区, 澳区, 台区, 日区, 新区, 美区, 欧区, 其他区, 低倍区, DIRECT] }

  # ==========================================
  # 4. 静默组
  # ==========================================
  - { name: 国内服务, type: select, proxies: [DIRECT, 港区, 日区, 新区], hidden: true }
  - { name: 广告拦截, type: select, proxies: [REJECT], hidden: true }

  # ==========================================
  # 5. 基础设施组（DNS/rules 结构需要）
  # ==========================================
  - { name: 代理DNS, type: select, proxies: [加密货币与兜底, 美区, 日区, 新区, 港区], hidden: true }
  - { name: 代理QUIC, type: select, proxies: [REJECT, PASS], hidden: true }

  # ==========================================
  # 6. 核心架构：同区故障转移专线 (置底)
  # ==========================================
  - { name: 港区, type: fallback, proxies: [港, 港备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 澳区, type: fallback, proxies: [澳, 澳备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 台区, type: fallback, proxies: [台, 台备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 日区, type: fallback, proxies: [日, 日备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 新区, type: fallback, proxies: [新, 新备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 美区, type: fallback, proxies: [美, 美备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 欧区, type: fallback, proxies: [欧, 欧备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 其他区, type: fallback, proxies: [其他, 其他备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }
  - { name: 低倍区, type: fallback, proxies: [低倍, 低倍备用], url: 'http://cp.cloudflare.com/generate_204', interval: 30 }

# ============================================================
# 规则引擎 (echs-top 骨架，目标组名适配自建架构)
# ============================================================
rules:
  # --- 端口级识别 ---
  - DST-PORT,5228-5230,DIRECT
  - DST-PORT,1337/2710/6881-6999/7777,加密货币与兜底

  # --- 私有地址优先 ---
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - DOMAIN-KEYWORD,libvio,DIRECT
  - DOMAIN-KEYWORD,uhdnow,Emby流媒体

  # --- 广告拦截 ---
  - RULE-SET,AWAvenue-Ads,广告拦截

  # --- 域名级分流（SUB-RULE 嵌套） ---
  - RULE-SET,fcm,DIRECT
  - SUB-RULE,(RULE-SET,captcha),captcha_rules
  - SUB-RULE,(RULE-SET,ai),ai_rules
  - SUB-RULE,(RULE-SET,telegram),telegram_rules
  - SUB-RULE,(RULE-SET,media),media_rules

  # --- 国内服务直连 ---
  - RULE-SET,google-cn,AI与Google
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,games-cn,DIRECT
  - RULE-SET,direct_domain,DIRECT
  - RULE-SET,cn,DIRECT

  # --- 代理域名分流 ---
  - SUB-RULE,(RULE-SET,google),google_rules
  - SUB-RULE,(RULE-SET,trackerslist),trackerslist_rules
  - SUB-RULE,(RULE-SET,proxy_domain),proxy_rules
  - RULE-SET,github,通讯与Github
  - SUB-RULE,(RULE-SET,proxy),proxy_rules

  # --- IP 级分流 ---
  - SUB-RULE,(RULE-SET,telegram_ip),telegram_rules
  - SUB-RULE,(RULE-SET,media_ip),media_rules
  - SUB-RULE,(RULE-SET,google_ip),google_rules
  - SUB-RULE,(RULE-SET,proxy_ip),proxy_rules

  # --- 国内 IP 直连 ---
  - RULE-SET,enhanced-FaaS-in-China_ip,DIRECT
  - RULE-SET,direct_ip,DIRECT
  - RULE-SET,cn_ip,DIRECT

  # --- QUIC 与高位端口兜底 ---
  - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
  - DST-PORT,10000-65535,加密货币与兜底

  # --- 全局兜底 ---
  - MATCH,加密货币与兜底

# ============================================================
# 子规则 (echs-top 骨架，MATCH 目标适配)
# ============================================================
sub-rules:
  fcm_rules:
    - MATCH,DIRECT
  captcha_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,加密货币与兜底
  ai_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,AI与Google
  telegram_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
    - MATCH,通讯与Github
  media_rules:
    - AND,((NETWORK,UDP),(DST-PORT,443)),代理QUIC
