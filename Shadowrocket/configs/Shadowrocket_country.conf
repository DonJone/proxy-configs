游戏平台 = select, DIRECT, 港区, 台区, 日区, 新区, 美区, 欧区, 低倍区, 其他区
微软苹果Nvidia = select, DIRECT, 美区, 日区, 新区, 台区, 欧区, 低倍区, 其他区
加密货币与兜底 = select, 港区, 澳区, 台区, 日区, 新区, 美区, 欧区, 其他区, 低倍区, DIRECT

# 5. 静默拦截组
